<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D - Estructura Paramétrica</title>
    <!-- Importa el componente de Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e; /* Fondo oscuro para resaltar la estructura */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
    </style>
</head>
<body>
<model-viewer 
        src="parametric_structure.glb" 
        alt="Modelo 3D de Estructura Paramétrica" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1"
        exposure="1.2">
    </model-viewer>
</body>
</html>
